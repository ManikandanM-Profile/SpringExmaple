<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add New Employee</title>

<style>
body {
	font-family: Arial, sans-serif;
	background: #f4f6f9;
	margin: 0;
	padding: 40px;
}

.container {
	width: 400px;
	margin: auto;
	background: white;
	padding: 25px;
	border-radius: 10px;
	box-shadow: 0 4px 12px #ccc;
}

h2 {
	text-align: center;
	color: #333;
}

label {
	display: block;
	margin-top: 15px;
	font-weight: bold;
}

input {
	width: 100%;
	box-sizing: border-box;
	padding: 10px;
	margin-top: 6px;
	border: 1px solid #ccc;
	border-radius: 5px;
}

button {
	width: 100%;
	margin-top: 22px;
	padding: 12px;
	background: #007bff;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
}

button:hover {
	background: #0056b3;
}

.success {
	color: green;
	text-align: center;
}
</style>
</head>

<body>

	<div class="container">

		<h2>Add New Employee</h2>

		<p class="success" th:if="${param.success}">Employee saved
			successfully!</p>

		<form th:action="@{/employees/save}" th:object="${employee}"
			method="post">

			<label>Employee Name</label> <input type="text" th:field="*{name}"
				placeholder="Enter employee name" required> <label>Email</label>
			<input type="email" th:field="*{email}" placeholder="Enter email"
				required> <label>Salary</label> <input type="number"
				th:field="*{salary}" placeholder="Enter salary" min="0" step="0.01"
				required>

			<button type="submit">Save Employee</button>

		</form>

	</div>
</body>
</html>
